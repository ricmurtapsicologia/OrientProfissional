name: Onda 6 — verificação HTTP pública
on:
  push:
    branches: [audit/onda6-publicacao-20261015]
    paths: [.github/workflows/onda6-pages-http.yml]
permissions:
  contents: read
jobs:
  publication-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Confirmar GitHub Pages e JavaScript publicado sem enviar dados
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, time, urllib.request
          projects = {
            'OrientProfissional': 'b4538826ced4baf656791258d2a4b5e7a6d2942c',
            'emocao360': 'f6eada3181424d0bd811ec30ce8aadcaf9d4d1ee',
            'rastreio.de.esquemas': 'fabb098e18b32c78b1ece61167c3bb20fe357ff0',
          }
          def read(url):
              req=urllib.request.Request(url, headers={'User-Agent':'Wave6-Public-ReadOnly-Smoke/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as resp:
                  if resp.status!=200: raise RuntimeError(str(resp.status)+' '+url)
                  return resp.read()
          for repo, commit in projects.items():
              public='https://ricmurtapsicologia.github.io/'+repo+'/'
              source='https://raw.githubusercontent.com/ricmurtapsicologia/'+repo+'/'+commit+'/'
              expected_html=read(source+'index.html')
              expected_js=read(source+'assets/js/app.js')
              assert b'<script src="./assets/js/app.js"></script>' in expected_html
              last_error=None
              for attempt in range(1,19):
                  try:
                      served_html=read(public)
                      served_js=read(public+'assets/js/app.js')
                      if served_html!=expected_html:
                          raise AssertionError('HTML da publicacao difere do commit aprovado')
                      if served_js!=expected_js:
                          raise AssertionError('JS da publicacao difere do commit aprovado')
                      digest=hashlib.sha256(served_js).hexdigest()[:16]
                      print('PASS',repo,'HTTP=200','HTML=identico','JS=identico','SHA256='+digest,'tentativa='+str(attempt),flush=True)
                      last_error=None
                      break
                  except Exception as exc:
                      last_error=exc
                      print('WAIT',repo,'tentativa',attempt,str(exc),flush=True)
                      if attempt<18: time.sleep(10)
              if last_error is not None:
                  raise SystemExit('FAIL '+repo+': '+str(last_error))
          print('PASS: 3/3 URLs publicas, zero POST, zero dados de usuario, 3/3 artefatos inteiros',flush=True)
          PY
